<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tavern Screen — TV</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/settings.js"></script>
</head>
<body class="tv">
  <div class="stage-wrap"><div id="stage" class="stage"></div></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/stage.js"></script>
  <script src="/audio.js"></script>
  <script>
    const root = document.getElementById('stage');
    const socket = io();
    socket.on('connect', () => socket.emit('screen:hello'));
    socket.on('state', (s) => { Settings.apply(s.settings.display); Stage.stage(root, s); }); // TV follows the table setting
    AudioOut.init(socket); // the TV is the speaker
    // Double-click for fullscreen on the TV.
    document.addEventListener('dblclick', () => document.documentElement.requestFullscreen?.());
  </script>
</body>
</html>
